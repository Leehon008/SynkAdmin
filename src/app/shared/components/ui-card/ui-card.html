<div class="card">

  @if (title()) {
    <div class="card-header">

      <div class="card-heading">
        <h2>{{ title() }}</h2>

        @if (subtitle()) {
          <p>{{ subtitle() }}</p>
        }
      </div>

      <div class="card-actions">
        <ng-content select="[card-actions]" />
      </div>

    </div>
  }

  <div class="card-content">
    <ng-content />
  </div>

</div>
