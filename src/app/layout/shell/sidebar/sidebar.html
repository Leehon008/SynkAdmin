<aside class="sidebar">

  <nav class="navigation">

    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active"
      ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">
      <span class="icon"><i class="bi bi-grid-1x2-fill"></i></span>
      <span>Dashboard</span>
    </a>

    <div class="section-title">
      ADMINISTRATION
    </div>

    <div class="facility-nav-group">
      <div class="facility-nav-row">
        <a class="nav-item facility-nav-link" routerLink="/facility" routerLinkActive="active"
          ariaCurrentWhenActive="page">
          <span class="icon"><i class="bi bi-building"></i></span>
          <span>Manage Facility</span>
        </a>
        <button class="facility-nav-toggle" type="button" aria-label="Toggle Manage Facility submenu"
          aria-controls="facility-submenu" [attr.aria-expanded]="isFacilityMenuOpen"
          (click)="toggleFacilityMenu()">
          <i class="bi bi-chevron-down" [class.rotated]="isFacilityMenuOpen" aria-hidden="true"></i>
        </button>
      </div>
      @if (isFacilityMenuOpen) {
        <div class="facility-submenu" id="facility-submenu">
          <a class="nav-item facility-subitem" routerLink="/admin-ops" routerLinkActive="active"
            ariaCurrentWhenActive="page">
            <span class="icon"><i class="bi bi-clipboard-data"></i></span>
            <span>Admin Ops</span>
          </a>
          <div class="admin-ops-submenu">
            <a class="nav-item facility-subitem admin-ops-subitem" routerLink="/admin-ops/staff"
              routerLinkActive="active" ariaCurrentWhenActive="page">
              <span class="icon"><i class="bi bi-people"></i></span>
              <span>Staff Management</span>
            </a>
            <a class="nav-item facility-subitem admin-ops-subitem" routerLink="/admin-ops/roles"
              routerLinkActive="active" ariaCurrentWhenActive="page">
              <span class="icon"><i class="bi bi-person-gear"></i></span>
              <span>Role Management</span>
            </a>
          </div>
        </div>
      }
    </div>

    <div class="section-title">
      RESIDENT CARE
    </div>

    <a class="nav-item" routerLink="/residents" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="icon"><i class="bi bi-person-hearts"></i></span>
      <span>Residents</span>
    </a>

    <a class="nav-item" routerLink="/emar" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="icon"><i class="bi bi-capsule"></i></span>
      <span>eMar</span>
    </a>

    <div class="section-title">
      OPERATIONS
    </div>

    <a class="nav-item" routerLink="/tasks" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="icon"><i class="bi bi-check2-square"></i></span>
      <span>Task Manager</span>
    </a>

    <a class="nav-item" routerLink="/form-builder" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="icon"><i class="bi bi-ui-checks-grid"></i></span>
      <span>Form Builder</span>
    </a>

    <a class="nav-item" routerLink="/fax" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="icon"><i class="bi bi-printer"></i></span>
      <span>Fax</span>
      <span class="new-badge">New</span>
    </a>

    <a class="nav-item" routerLink="/reports" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="icon"><i class="bi bi-bar-chart-line"></i></span>
      <span>Reports</span>
      <span class="arrow">⌄</span>
    </a>

    <a class="nav-item" routerLink="/resources" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="icon"><i class="bi bi-journals"></i></span>
      <span>Resources</span>
    </a>

  </nav>

  <a class="get-started" routerLink="/getting-started">
    <span>✓</span>
    Get Started
  </a>

</aside>
